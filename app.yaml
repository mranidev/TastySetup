# Required fields
kind: wasmer.io/App.v0
owner: elalaoui
name: tastysetup
package: .

# Optional fields
debug: false
scaling:
  mode: single_concurrency
locality:
  regions:
  - fr-roub1

env:
  APP_NAME: TastySetup
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_DATABASE: "${DB_NAME}"
  DB_PREFIX: ti_
  DB_ALLOW_NO_PRIMARY_KEY: "true"
  CACHE_DRIVER: database
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: database
  MAIL_MAILER: log
  SESSION_LIFETIME: "120"
  LOG_CHANNEL: stderr
  BROADCAST_DRIVER: log
  IGNITER_LOCATION_MODE: single

capabilities:
  instaboot:
    requests:
      - path: /
  database:
    engine: mysql
