name: tastysetup
app_id: da_KwGIWtMUmbWo
owner: elalaoui
package: .
locality:
  regions:
  - fr-roub1
env:
  APP_NAME: TastySetup
  APP_ENV: production
  APP_DEBUG: 'true'
  DB_CONNECTION: mysql
  DB_PREFIX: ti_
  DB_ALLOW_NO_PRIMARY_KEY: 'true'
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: file
  MAIL_MAILER: log
  SESSION_LIFETIME: '120'
  LOG_CHANNEL: stderr
  BROADCAST_DRIVER: log
  IGNITER_LOCATION_MODE: single
capabilities:
  instaboot:
    mode: null
    requests:
    - path: /
  database:
    engine: mysql
debug: false
scaling:
  mode: single_concurrency
kind: wasmer.io/App.v0
